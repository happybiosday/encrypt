<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Encryption Tool</title>
<style>
body {
  font-family: 'Courier New', monospace;
  background: #000;
  color: #00FF00;
  padding: 20px;
}
h1 {
  color: #00FF00;
}
input, textarea {
  background: transparent;
  color: #00FF00;
  border: 2px solid #00FF00;
  padding: 8px;
  font-size: 16px;
  width: 100%;
  box-sizing: border-box;
  outline: none;
}
textarea {
  height: 100px;
  resize: none;
}
button {
  background: #000;
  color: #00FF00;
  border: 2px solid #00FF00;
  padding: 8px 16px;
  margin-right: 5px;
  cursor: pointer;
  font-size: 16px;
}
button:hover {
  background: #003300;
}
#output {
  background: #000;
  color: #00FF00;
  padding: 10px;
  min-height: 50px;
  white-space: pre-wrap;
  border: 2px solid #00FF00;
  margin-top: 10px;
}
label {
  color: #00FF00;
}
</style>
</head>
<body>
<h1>Encryption Tool</h1>

<label>Input</label>
<textarea id="text"></textarea>

<label>Key 1</label>
<input type="number" id="keyA" value="3">

<label>Key 2</label>
<input type="number" id="keyB" value="7">

<label>Key 3</label>
<input type="number" id="keyC" value="11">

<button onclick="encryptText()">Encrypt</button>
<button onclick="decryptText()">Decrypt</button>

<h2>Output</h2>
<div id="output"></div>
<button onclick="copyOutput()">Copy</button>

<script>
// -----------------------------
// Helper Functions
// -----------------------------

function mulberry32(a) {
  return function() {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  }
}

function substitutionTable(a, b, c) {
  let seed = a * 10000 + b * 100 + c;
  let table = Array.from({length: 256}, (_, i) => i);
  let rng = mulberry32(seed);
  for (let i = table.length - 1; i > 0; i--) {
    let j = Math.floor(rng() * (i + 1));
    [table[i], table[j]] = [table[j], table[i]];
  }
  let inverse = [];
  for (let i = 0; i < 256; i++) inverse[table[i]] = i;
  return {table, inverse};
}

// -----------------------------
// Unified Encryption / Decryption
// -----------------------------

function encryptChar(charCode, a, b, c, index) {
  let val = (charCode + a + b + c + index*7) % 256;
  val = (val * (a || 1) + b + index*3) % 256;
  return val;
}

function decryptChar(charCode, a, b, c, index) {
  let a_inv = 1;
  for (let i = 1; i < 256; i++) if ((a*i) % 256 === 1) a_inv = i;
  let val = (a_inv * (charCode - b - index*3 + 256)) % 256;
  val = (val - a - b - c - index*7 + 256) % 256;
  return val;
}

function encryptText() {
  let text = document.getElementById("text").value;
  let a = parseInt(document.getElementById("keyA").value);
  let b = parseInt(document.getElementById("keyB").value);
  let c = parseInt(document.getElementById("keyC").value);
  let {table} = substitutionTable(a,b,c);
  let result = "";

  for (let i = 0; i < text.length; i++) {
    let ch = text.charCodeAt(i);
    let val = encryptChar(ch, a, b, c, i);
    val = table[val];
    result += String.fromCharCode(val);
  }

  document.getElementById("output").textContent = result;
}

function decryptText() {
  let text = document.getElementById("text").value;
  let a = parseInt(document.getElementById("keyA").value);
  let b = parseInt(document.getElementById("keyB").value);
  let c = parseInt(document.getElementById("keyC").value);
  let {inverse} = substitutionTable(a,b,c);
  let result = "";

  for (let i = 0; i < text.length; i++) {
    let ch = text.charCodeAt(i);
    let val = inverse[ch];
    val = decryptChar(val, a, b, c, i);
    result += String.fromCharCode(val);
  }

  document.getElementById("output").textContent = result;
}

// -----------------------------
// Copy Button
// -----------------------------
function copyOutput() {
  const output = document.getElementById("output").textContent;
  navigator.clipboard.writeText(output).then(() => {
    alert("Copied.");
  });
}
</script>
</body>
</html>
